---
services:
  db:
    image: vpavanvemula/flm-oct:db
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: vpavanvemula/flm-oct:auth
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - mynetwork

  book_service:
    image: vpavanvemula/flm-oct:book
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynetwork

  borrow_service:
    image: vpavanvemula/flm-oct:borrow
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynetwork

  frontend:
    image: vpavanvemula/flm-oct:frontend
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    networks:
      - mynetwork

networks:
  mynetwork:
    external: true
