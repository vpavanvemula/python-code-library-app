---
services:
  db:
    image: vpavanvemula/flm-oct:db
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork2

  auth_service:
    image: vpavanvemula/flm-oct:auth
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - mynetwork2
    depends_on:
      - db
    

  book_service:
    image: vpavanvemula/flm-oct:book
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynetwork2
    depends_on:
      - db
  borrow_service:
    image: vpavanvemula/flm-oct:borrow
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynetwork2
    depends_on:
      - db

  frontend:
    image: vpavanvemula/flm-oct:frontend
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    networks:
      - mynetwork2
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork2:
    driver: overlay
